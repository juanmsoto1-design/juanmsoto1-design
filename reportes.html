<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reportes · Registro de Calificaciones</title>
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@media print {
  .sidebar, .sidebar-toggle, .toolbar-actions, .back-link { display: none !important; }
  .card { box-shadow: none; border: 1px solid #ccc; }
  .main-content { padding-top: 0 !important; }
}
</style>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>

  <div class="main-content">
    <div class="container">
      <div class="toolbar">
        <h2 style="margin:0">Reporte de calificaciones por materia y profesor</h2>
        <div class="toolbar-actions">
          <button class="btn btn-secondary" onclick="window.print()">🖨 Imprimir / Exportar PDF</button>
        </div>
      </div>

      <div id="resumen-general" class="card"></div>

      <div id="reporte-por-profesor"></div>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/reportes.js"></script>
</body>
</html>
