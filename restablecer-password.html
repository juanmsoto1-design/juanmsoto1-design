<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Restablecer contraseña · Registro de Calificaciones</title>
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="login-wrapper">
  <div class="card login-card">
    <h1 style="font-size:20px;">Restablecer contraseña</h1>
    <p class="subtitle">UNAD</p>

    <div id="bloque-cargando">
      <p style="color:#6b7280; font-size:14px; text-align:center;">Verificando el enlace...</p>
    </div>

    <div id="bloque-form" class="hidden">
      <form id="form-restablecer">
        <label for="pass-nueva">Nueva contraseña</label>
        <input id="pass-nueva" type="password" required minlength="6" autocomplete="new-password" />
        <label for="pass-confirmar">Confirmar contraseña</label>
        <input id="pass-confirmar" type="password" required minlength="6" autocomplete="new-password" />
        <div class="error-msg" id="restablecer-error"></div>
        <button class="btn btn-primary" style="width:100%" type="submit">Guardar nueva contraseña</button>
      </form>
    </div>

    <div id="bloque-exito" class="hidden" style="text-align:center;">
      <div style="font-size:40px;">✅</div>
      <h3 style="color:#1e7a34;">Contraseña actualizada</h3>
      <p style="color:#6b7280; font-size:14px;">Ya puedes iniciar sesión con tu nueva contraseña.</p>
      <button class="btn btn-primary" style="width:100%;" onclick="window.location.href='index.html'">Ir a iniciar sesión</button>
    </div>

    <div id="bloque-invalido" class="hidden" style="text-align:center;">
      <p style="color:#b3261e; font-size:14px;">
        Este enlace no es válido o ya expiró. Solicita uno nuevo desde la pantalla de inicio de sesión con "¿Olvidaste tu contraseña?".
      </p>
      <button class="btn btn-secondary" style="width:100%; margin-top:10px;" onclick="window.location.href='index.html'">Volver a iniciar sesión</button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script>
window.sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

function mostrarBloque(nombre) {
  document.getElementById("bloque-cargando").classList.toggle("hidden", nombre !== "cargando");
  document.getElementById("bloque-form").classList.toggle("hidden", nombre !== "form");
  document.getElementById("bloque-exito").classList.toggle("hidden", nombre !== "exito");
  document.getElementById("bloque-invalido").classList.toggle("hidden", nombre !== "invalido");
}

// Supabase detecta el token de recuperación en la URL automáticamente al cargar el cliente
// y dispara el evento PASSWORD_RECOVERY cuando el enlace es válido.
let sesionLista = false;

window.sb.auth.onAuthStateChange((event, session) => {
  if (event === "PASSWORD_RECOVERY" && session) {
    sesionLista = true;
    mostrarBloque("form");
  }
});

(async () => {
  // Fallback: si el evento ya se disparó antes de registrar el listener, revisamos la sesión directamente.
  await new Promise((r) => setTimeout(r, 800));
  if (sesionLista) return;
  const { data: { session } } = await window.sb.auth.getSession();
  if (session) {
    mostrarBloque("form");
  } else {
    mostrarBloque("invalido");
  }
})();

document.getElementById("form-restablecer").addEventListener("submit", async (e) => {
  e.preventDefault();
  const nueva = document.getElementById("pass-nueva").value;
  const confirmar = document.getElementById("pass-confirmar").value;
  const errorEl = document.getElementById("restablecer-error");
  errorEl.textContent = "";

  if (nueva !== confirmar) {
    errorEl.textContent = "Las contraseñas no coinciden.";
    return;
  }

  const { error } = await window.sb.auth.updateUser({ password: nueva });
  if (error) {
    errorEl.textContent = "No se pudo actualizar: " + error.message;
    return;
  }
  mostrarBloque("exito");
});
</script>
</body>
</html>
